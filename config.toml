# project config

[obs]
t_start      = "2026-11-01T00:00:00Z" # UTC timestamp for starting obs
t_total      = 100.0                  # total obs time in seconds
samp_rate    = 1.0e+7                 # 10MHz sampling rate
central_freq = 1.418e+9               # 1418 MHz central frequency
n_chan       = 1                      # num of ch per antenna

[gain]
rf = 14 # rf gain in db
if = 32 # if gain in db
bb = 32 # bb gain in db

[hackrf]
n_stations = 10 # number of antennas
serial_num = [
"0000000000000000a06063c8247a835f", # station 01
"0000000000000000325866e622b64e23", # station 02
"0000000000000000a06063c825492b5f", # station 03
"0000000000000000a06063c822827f5f", # station 04
"0000000000000000a06063c82372395f", # station 05
"0000000000000000909864c8366414cf", # station 06
"0000000000000000a06063c8247a735f", # station 07
"0000000000000000a06063c82299575f", # station 08
"0000000000000000a06063c8258c895f", # station 09
"0000000000000000a06063c82410685f", # station 10
]
bias = 1 # bias tee

[data]
obs  = "data/obs"  # observation data repo
test = "data/test" # test data repo

[test]
t_total   = 10.0   # test obs duration in seconds
samp_rate = 1.0e+6 # 1MHz test sampling rate
