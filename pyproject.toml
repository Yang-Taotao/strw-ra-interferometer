[tool.ruff]
target-version = "py314"
line-length    = 88
src            = ["src", "scripts"]
extend-exclude = ["notebooks", "data", "docs"]

[tool.ruff.lint]
select        = ["E", "F", "I", "UP"]
extend-select = ["B", "N", "SIM", "NPY", "PTH", "ANN", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["raifm"]
